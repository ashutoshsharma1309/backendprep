name: Build & Test Library Service

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build and test
        working-directory: ./project
        run: mvn -B clean verify

      # Uncomment as later phases add these dependencies, so CI has
      # real services to test against instead of failing on connection errors.
